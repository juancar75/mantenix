# Integración continua: se ejecuta en cada pull request y en cada push a main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  nucleo:
    name: Núcleo (formato, avisos y pruebas)
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --exclude mantenix-app -- -D warnings
      - run: cargo test --workspace --exclude mantenix-app

  interfaz:
    name: Interfaz (tipos y compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

  privacidad:
    name: Sin datos privados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que no hay bases de datos ni carpeta privado/
        run: |
          if git ls-files | grep -E '(^privado/|\.db$)'; then
            echo "::error::Hay ficheros privados en el repositorio"; exit 1
          fi
