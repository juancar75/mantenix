    id: necesidad
    attributes:
      label: Necesidad
      description: Qué problema resuelve y para quién.
    validations: { required: true }
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
